version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: petshop-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrong!Pass123
      POSTGRES_DB: PetShop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  petshop-api:
    build:
      context: .
      dockerfile: PetShop.API/Dockerfile
    container_name: petshop-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PetShop="Host=postgres;Port=5432;Database=PetShop;Username=postgres;Password=YourStrong!Pass123"
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpireHours=${JWT_EXPIRE_HOURS}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - EmailSettings__SenderEmail=${EMAIL_SENDER}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__SmtpServer=${EMAIL_SMTP}
      - Facebook__AppId=${FACEBOOK_APP_ID}
      - Facebook__AppSecret=${FACEBOOK_APP_SECRET}
      - Mapbox__AccessToken=${MAPBOX_TOKEN}

volumes:
  postgres_data:

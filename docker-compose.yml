version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: petshop-sql
    environment:
      SA_PASSWORD: "YourStrong!Pass123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  petshop-api:
    build:
      context: .
      dockerfile: PetShop.API/Dockerfile
    container_name: petshop-api
    depends_on:
      - sqlserver
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PetShop=${CONNECTION_STRING}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpireHours=${JWT_EXPIRE_HOURS}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - EmailSettings__SenderEmail=${EMAIL_SENDER}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__SmtpServer=${EMAIL_SMTP}
      - Facebook__AppId=${FACEBOOK_APP_ID}
      - Facebook__AppSecret=${FACEBOOK_APP_SECRET}
      - Mapbox__AccessToken=${MAPBOX_TOKEN}

volumes:
  sql_data:
